<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Chart</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://res.cdn.office.net/teams-js/2.31.1/js/MicrosoftTeams.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; }
    #chart { width: 100vw; height: 100vh; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-size: 1.2rem; color: #666;
    }
    #error {
      display: none; padding: 2rem; text-align: center;
      color: #c00; font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div id="loading">Loading chart...</div>
  <div id="error"></div>
  <div id="chart" style="display:none;"></div>

  <script>
    (async function () {
      const loadingEl = document.getElementById("loading");
      const errorEl = document.getElementById("error");
      const chartEl = document.getElementById("chart");

      function showError(message) {
        loadingEl.style.display = "none";
        errorEl.style.display = "block";
        errorEl.textContent = message;
      }

      // Initialize Teams SDK (required for Stage View)
      try {
        await microsoftTeams.app.initialize();
      } catch (e) {
        // Not running inside Teams — continue anyway for browser testing
        console.warn("Teams SDK init failed (may not be in Teams):", e);
      }

      // Get chart ID from URL
      const params = new URLSearchParams(window.location.search);
      const chartId = params.get("id");
      if (!chartId) {
        showError("No chart ID provided.");
        return;
      }

      // Fetch chart data from the bot server
      try {
        const response = await fetch(`/api/chart/${chartId}`);
        if (!response.ok) {
          showError("Chart not found or expired.");
          return;
        }

        const plotlySchema = await response.json();

        // Render the chart
        loadingEl.style.display = "none";
        chartEl.style.display = "block";

        const layout = {
          ...plotlySchema.layout,
          autosize: true,
          margin: { l: 60, r: 30, t: 50, b: 60 },
        };

        Plotly.newPlot(chartEl, plotlySchema.data, layout, {
          responsive: true,
          displayModeBar: true,
        });
      } catch (e) {
        showError("Failed to load chart data.");
        console.error(e);
        return;
      }

      // Notify Teams that the page loaded successfully
      try {
        await microsoftTeams.app.notifySuccess();
      } catch (e) {
        console.warn("notifySuccess failed:", e);
      }
    })();
  </script>
</body>
</html>
